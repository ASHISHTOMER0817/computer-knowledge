  const correct = QUESTIONS.filter(item => picks[item.n] === item.answer).length;
  document.getElementById("meta").textContent =
    "Question " + (index + 1) + " of " + list.length + "  ·  " + answered + " answered  ·  " + correct + " correct";
  const card = document.getElementById("card");
  card.innerHTML = "";
  const num = document.createElement("div");
  num.className = "qnum";
  num.textContent = q.section + "  ·  " + q.n;
  const stem = document.createElement("h2");
  stem.className = "stem";
  stem.textContent = q.stem;
  card.appendChild(num);
  card.appendChild(stem);
  const chosen = picks[q.n];
  const revealed = chosen !== undefined;
  q.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = LETTERS[i] + ".  " + text;
    if (revealed) {
      b.disabled = true;
      if (i === q.answer) b.classList.add("correct");
      else if (i === chosen) b.classList.add("wrong");
    }
    b.addEventListener("click", () => {
      if (picks[q.n] !== undefined) return;
      picks[q.n] = i;
      save();
      render();
    });
    card.appendChild(b);
  });
  if (revealed) {
    const box = document.createElement("div");
    box.className = "explain";
    const title = document.createElement("strong");
    title.textContent = "Correct answer: " + LETTERS[q.answer];
    const body = document.createElement("div");
    body.textContent = q.explain;
    box.appendChild(title);
    box.appendChild(body);
    card.appendChild(box);
  }
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === list.length - 1;
  renderFilters();
}
document.getElementById("prev").addEventListener("click", () => { if (index > 0) { index--; render(); } });
document.getElementById("next").addEventListener("click", () => { if (index < pool().length - 1) { index++; render(); } });
document.addEventListener("keydown", (event) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (event.key === "ArrowLeft" && index > 0) { index--; render(); }
  if (event.key === "ArrowRight" && index < pool().length - 1) { index++; render(); }
});
render();
</script>
</body>
</html>
